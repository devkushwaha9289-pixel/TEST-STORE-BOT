<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7f7fa">
<title>VILLAGEE SMS SHOP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <header id="header">
    <button id="brandButton" class="brand-wrap" type="button" aria-label="Open market">
      <div class="brand-logo">V</div>
      <div>
        <div class="brand">VILLAGEE</div>
        <div class="brand-mini">SMS SHOP</div>
      </div>
    </button>
    <button id="balance" class="balance" type="button">₹0</button>
  </header>

  <div id="crumbs" class="hidden"></div>
  <main id="main"></main>

  <nav id="tabs" aria-label="Main navigation">
    <button data-tab="store" class="active" type="button"><span>▣</span><small>Market</small></button>
    <button data-tab="deposit" type="button"><span>▤</span><small>Wallet</small></button>
    <button data-tab="refer" type="button"><span>♧</span><small>Referral</small></button>
    <button data-tab="profile" type="button"><span>♙</span><small>Profile</small></button>
  </nav>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="loader" class="hidden" aria-hidden="true"><div class="spinner"></div></div>
<script src="/static/app.js"></script>
</body>
</html>
